<!--
    Personal Profile Form (Bootstrap + JavaScript)
    @author wafiy
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Personal Profile Form</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- My own CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow">
                    <div class="card-header text-center">
                        <h1 class="h3 mb-0">Personal Profile Form</h1>
                    </div>

                    <div class="card-body p-4">

                        <form id="profileForm" action="ProfileServlet" method="post" novalidate>

                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="name" name="name" required>
                                <div class="invalid-feedback">Please enter your name.</div>
                            </div>

                            <div class="mb-3">
                                <label for="studentId" class="form-label">Student ID</label>
                                <input type="text" class="form-control" id="studentId" name="studentId"
                                       pattern="[0-9]{10}" maxlength="10" required>
                                <div class="invalid-feedback">Student ID must be 10 digits (numbers only).</div>
                            </div>

                            <div class="mb-3">
                                <label for="programme" class="form-label">Programme</label>
                                <input type="text" class="form-control" id="programme" name="programme" required>
                                <div class="invalid-feedback">Please enter your programme.</div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                                <div class="invalid-feedback">Please enter a valid email address.</div>
                            </div>

                            <div class="mb-3">
                                <label for="hobbies" class="form-label">Hobbies</label>
                                <input type="text" class="form-control" id="hobbies" name="hobbies" required>
                                <div class="invalid-feedback">Please enter your hobbies.</div>
                            </div>

                            <div class="mb-3">
                                <label for="intro" class="form-label">Short Self-Introduction</label>
                                <textarea class="form-control" id="intro" name="intro" rows="4"
                                          maxlength="300" required></textarea>
                                <div class="d-flex justify-content-between">
                                    <div class="invalid-feedback">Please write a short introduction.</div>
                                    <small class="text-muted ms-auto"><span id="charCount">0</span>/300</small>
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Submit Profile</button>
                                <button type="reset" class="btn btn-outline-secondary">Clear Form</button>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- My own JavaScript -->
    <script src="js/script.js"></script>
</body>
</html>
